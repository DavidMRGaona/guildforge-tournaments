name: Tests

on:
  pull_request:
    branches: [main]

# A new push to the same pull request cancels the run it makes obsolete
concurrency:
  group: tests-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  test:
    uses: DavidMRGaona/GuildForge/.github/workflows/reusable-module-tests.yml@main
    with:
      module_name: 'tournaments'
      # Host branch, tag or SHA to test against (main when the variable is unset)
      host_ref: ${{ vars.GUILDFORGE_HOST_REF || 'main' }}
    permissions:
      contents: read

  # The core's PHPStan configuration (Larastan, level 8) over src/ and tests/, through
  # the module's phpstan.neon, analysed from inside the core like the tests
  phpstan:
    name: PHPStan
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: src
    steps:
      - name: Checkout host application
        uses: actions/checkout@v7
        with:
          repository: DavidMRGaona/GuildForge
          ref: ${{ vars.GUILDFORGE_HOST_REF || 'main' }}
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: pdo_pgsql, pdo_sqlite, redis, gd, zip, bcmath, intl
          coverage: none

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache Composer dependencies
        uses: actions/cache@v6
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-php8.5-composer-${{ hashFiles('src/composer.lock') }}
          restore-keys: ${{ runner.os }}-php8.5-composer-

      - name: Install host dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Checkout module
        uses: actions/checkout@v7
        with:
          path: src/modules/tournaments
          persist-credentials: false

      - name: Run PHPStan
        run: vendor/bin/phpstan analyse -c modules/tournaments/phpstan.neon --no-progress --memory-limit=2G

  # The Vue tests (tests/js) run inside the core, whose sources the components import through '@/'
  vue:
    name: Vue tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout host application
        uses: actions/checkout@v7
        with:
          repository: DavidMRGaona/GuildForge
          ref: ${{ vars.GUILDFORGE_HOST_REF || 'main' }}
          persist-credentials: false
          sparse-checkout: |
            src/resources/js

      - name: Checkout module
        uses: actions/checkout@v7
        with:
          path: src/modules/tournaments
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            src/package-lock.json
            src/modules/tournaments/package-lock.json

      - name: Install host dependencies
        working-directory: src
        run: npm ci

      - name: Install module dependencies
        working-directory: src/modules/tournaments
        run: npm ci

      - name: Run Vue tests
        working-directory: src/modules/tournaments
        run: npm test
